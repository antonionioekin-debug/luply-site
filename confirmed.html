<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confermata | Luply</title>
  <link rel="icon" href="logo.png?v=5" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fffaf0 0%, #fff6e5 50%, #f8ead2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #2e2e2e;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 42px 26px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 70px rgba(244, 163, 0, 0.16);
    }

    .logo {
      width: 240px;
      max-width: 80%;
      margin-bottom: 22px;
    }

    .icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-size: 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    p {
      max-width: 430px;
      margin: 18px auto 0;
      color: #666;
      font-size: 18px;
      line-height: 1.5;
    }

    .note {
      margin-top: 26px;
      padding: 14px 18px;
      border-radius: 18px;
      background: #111;
      color: white;
      font-weight: 800;
      font-size: 15px;
    }

    .small {
      margin-top: 22px;
      color: #9a8f7f;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="logo.png?v=5" alt="Luply" />

    <div class="icon">✓</div>

    <h1>Email confermata</h1>

    <p>
      Il tuo account Luply è stato verificato correttamente.
      Ora puoi tornare nell’app ed effettuare l’accesso.
    </p>

    <div class="note">
      Puoi chiudere questa pagina e aprire Luply.
    </div>

    <div class="small">Luply.app</div>
  </main>
</body>
</html>
