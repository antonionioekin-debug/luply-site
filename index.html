<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Luply</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFF6E5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    img {
      width: 280px; /* 🔥 logo più grande */
      max-width: 80%;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 42px; /* 🔥 più impatto */
      color: #2E2E2E;
      margin: 0;
      font-weight: 700;
    }

    p {
      margin-top: 5px;
      color: #777;
      font-size: 18px;
      max-width: 300px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="logo.png" alt="Luply" />
    <h1>Coming Soon</h1>
    <p>La nuova app per scambiare ciò che non usi.</p>
  </div>
</body>
</html>
