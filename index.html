<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Luply | Coming Soon</title>
  <meta name="description" content="Scambia ciò che non usi. Trova ciò che desideri." />

  <link rel="icon" href="logo.png?v=4" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #fffaf0 0%, #fff6e5 45%, #f8ead2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #2e2e2e;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 620px;
      width: 100%;
      padding: 48px 30px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: 0 24px 80px rgba(244, 163, 0, 0.16);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 320px;
      max-width: 82%;
      margin-bottom: 26px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(244, 163, 0, 0.14);
      color: #d97706;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      margin: 0;
      font-weight: 800;
    }

    p {
      margin: 22px auto 0;
      color: #686868;
      font-size: 20px;
      max-width: 460px;
    }

    .waitlist {
      margin: 30px auto 0;
      display: flex;
      gap: 10px;
      max-width: 420px;
    }

    input {
      flex: 1;
      border-radius: 999px;
      padding: 15px;
      border: 1px solid #ddd;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 15px 22px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #F4A300, #FF7A00);
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .success { color: green; }
    .error { color: red; }

    .small {
      margin-top: 24px;
      font-size: 14px;
      color: #9a8f7f;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="logo.png?v=4" alt="Luply" />

    <div class="badge">App in arrivo</div>

    <h1>Coming Soon</h1>

    <p>Scambia ciò che non usi. Trova ciò che desideri.</p>

    <form class="waitlist" onsubmit="subscribe(event)">
      <input id="email" type="email" placeholder="Lascia la tua email" required />
      <button type="submit">Avvisami</button>
    </form>

    <div id="success" class="message success">✅ Email salvata!</div>
    <div id="error" class="message error">❌ Errore, riprova.</div>

    <div class="small">Luply.app</div>
  </main>

  <script>
    const supabase = window.supabase.createClient(
      "https://kgdjjmcsvegzjpocypxv.supabase.co",
      "sb_publishable_GltiBF6Aci22_c6jnrI1bA_19lvUmJD"
    );

    async function subscribe(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;

      const { error } = await supabase
        .from("landing_waitlist")
        .insert([{ email }]);

      if (error) {
        document.getElementById("error").style.display = "block";
      } else {
        document.getElementById("success").style.display = "block";
        document.getElementById("email").value = "";
      }
    }
  </script>

</body>
</html>
