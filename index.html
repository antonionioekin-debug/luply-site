<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Luply | Coming Soon</title>
  <meta name="description" content="Scambia ciò che non usi. Trova ciò che desideri." />

  <link rel="icon" href="logo.png?v=4" />

  <meta property="og:title" content="Luply - Coming Soon" />
  <meta property="og:description" content="Scambia ciò che non usi. Trova ciò che desideri." />
  <meta property="og:image" content="https://luply.app/logo.png?v=4" />
  <meta property="og:url" content="https://luply.app" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Luply - Coming Soon" />
  <meta name="twitter:description" content="Scambia ciò che non usi. Trova ciò che desideri." />
  <meta name="twitter:image" content="https://luply.app/logo.png?v=4" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #fffaf0 0%, #fff6e5 45%, #f8ead2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #2e2e2e;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 620px;
      width: 100%;
      padding: 48px 30px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: 0 24px 80px rgba(244, 163, 0, 0.16);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.8s ease-out;
    }

    .logo {
      width: 320px;
      max-width: 82%;
      height: auto;
      margin-bottom: 26px;
      filter: drop-shadow(0 12px 24px rgba(255, 122, 0, 0.20));
      animation: logoPop 0.9s ease-out;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(244, 163, 0, 0.14);
      color: #d97706;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 0.95;
      margin: 0;
      font-weight: 800;
      letter-spacing: -2px;
    }

    p {
      margin: 22px auto 0;
      color: #686868;
      font-size: clamp(19px, 2.2vw, 23px);
      line-height: 1.45;
      max-width: 460px;
    }

    .waitlist {
      margin: 30px auto 0;
      display: flex;
      gap: 10px;
      max-width: 420px;
      width: 100%;
    }

    input {
      flex: 1;
      border: 1px solid rgba(244, 163, 0, 0.35);
      border-radius: 999px;
      padding: 15px 18px;
      font-size: 15px;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 15px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #F4A300, #FF7A00);
      box-shadow: 0 12px 24px rgba(255, 122, 0, 0.25);
    }

    .small {
      margin-top: 24px;
      font-size: 14px;
      color: #9a8f7f;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoPop {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 22px;
        border-radius: 28px;
      }

      .logo {
        width: 260px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .waitlist {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="logo.png?v=4" alt="Luply" />

    <div class="badge">App in arrivo</div>

    <h1>Coming Soon</h1>

    <p>
      Scambia ciò che non usi. Trova ciò che desideri.
    </p>

    <form class="waitlist">
      <input type="email" placeholder="Lascia la tua email" />
      <button type="submit">Avvisami</button>
    </form>

    <div class="small">
      Luply.app
    </div>
  </main>
</body>
</html>
